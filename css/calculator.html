<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        body {
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            background-color: black;
            border: 2px solid black;
            border-radius: 20px;
            padding-top:200px;
        }

        .display {
            font-size: 50px;
            background-color: black;
            color: white;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            width: 100%;
            height: 100px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .container1, .container2, .container3,
        .container4, .container5 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: black;
            gap: 10px;
            margin-bottom: 10px;
        }

        .circle0 {
            border-radius: 40px;
            width: 150px;
            height: 65px;
            background-color: rgb(199, 194, 194);
            display: flex;
            justify-content: center;
            align-items: center;

            box-sizing: border-box;
            font-size: 30px;
            color: black;
            font-weight: bold;
        }

        .circle1 {
            border-radius: 50%;
            width: 65px;
            height: 65px;
            background-color: rgb(199, 194, 194);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            color: black;
            font-weight: bold;
            flex-shrink: 0;
        }

        .circle2 {
            border-radius: 50%;
            width: 65px;
            height: 65px;
            background-color: rgb(245, 173, 39);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <div class="display">7744</div>

        <div class="container1">
            <div class="circle1">C</div>
            <div class="circle1">+/-</div>
            <div class="circle1">%</div>
            <div class="circle2">/</div>
        </div>

        <div class="container2">
            <div class="circle1">7</div>
            <div class="circle1">8</div>
            <div class="circle1">9</div>
            <div class="circle2">×</div>
        </div>

        <div class="container3">
            <div class="circle1">4</div>
            <div class="circle1">5</div>
            <div class="circle1">6</div>
            <div class="circle2">-</div>
        </div>

        <div class="container4">
            <div class="circle1">1</div>
            <div class="circle1">2</div>
            <div class="circle1">3</div>
            <div class="circle2">+</div>
        </div>

        <div class="container5">
            <div class="circle0">0</div>
            <div class="circle1">.</div>
            <div class="circle2">=</div>
        </div>
    </div>
</body>
</html>
