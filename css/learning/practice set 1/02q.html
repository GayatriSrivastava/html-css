<!-- Q2: Create 3 headings with h1, h2 & h3.
Give them all a class "heading" & set color of "heading" to red. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .heading{
            color:red;
        }
    </style>
</head>
<body>
    <div class="heading">
    <h1>heading 1</h1>
    <h2>heading 2</h2>
    <h3>heading 3</h3>
    </div>
</body>
</html>
