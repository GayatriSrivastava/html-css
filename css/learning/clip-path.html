<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        img {
            clip-path: circle(50%);
            width: 200px;
            height: 200px;
        }

        .img1 {
            clip-path: ellipse(50% 35%);
            width: 200px;
            height: 200px;
        }

        .img2 {
            clip-path: polygon(50% 0%, 100% 100%, 50% 50%);
            width: 200px;
            height: 200px;

        }
        .img3{
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }


    </style>
</head>

<body>
    <img src="https://images.unsplash.com/photo-1795307026712-1116f5902e4f?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
    <img src="https://plus.unsplash.com/premium_photo-1794970308946-5c456b46c692?q=80&w=898&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="" class="img1">
    <img src="https://images.unsplash.com/photo-1794917306735-75bc01e7d618?q=80&w=930&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="" class="img2">
    <img src="https://images.unsplash.com/photo-1795061921013-45c93ba8523d?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D">
    
    <div class="container"></div>
</body>

</html>
