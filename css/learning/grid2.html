<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            border: 2px solid red;
            height: 90vh;
            grid-template-areas: "header header"
                                "heroimage  sidebar"
                                "heroimage  sidebar"
                                "heroimage  content"
        }

        .container div {
            border:2px solid;
        }
        .header{
            grid-area: header;
        }
        .hero-img{
            grid-area: heroimage;
        }
        .sidebar{
            grid-area: sidebar;
        }
        .content{
            grid-area: content;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">header</div>
        <div class="hero-img">hero-image</div>
        <div class="sidebar">sidebar</div>
        <div class="content">content</div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>

</body>

</html>
