
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont {
            display: flex;
            height: 99vh;
            width: 90vw;
            background-color: white;
            border: 2px solid green;
            flex-direction: row;
            flex-wrap: wrap;
            align-content: space-between;
            padding:30px;
        }

        .cont div {
            height: 70px;
            width: 70px;
            border: 1px solid red;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="cont">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
</body>
</html>
