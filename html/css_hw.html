<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css hw</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #451616;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 320px;
            background-color: rgb(0, 0, 0);
            border: 1px solid #dddddd;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(122, 20, 20, 0.1);
        }

        .card img {
            width: 100%;
            height: 225px;
            object-fit: cover;
            display: block;
        }

        .content {
            padding: 20px;
        }

        .tags {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .tags span {
            color: #eddfdf;
            font-size: 14px;
        }

        h2 {
            color: #cc9c9c;
            font-size: 25px;
            margin-bottom: 18px;
        }

        p {
            color: #80c000;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        button {
            display: block;
            margin: auto;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background-color: #eef2ff;
            color: #5269a5;
            cursor: pointer;
        }

        button:hover {
            background-color: #02071a;
        }

    </style>
</head>

<body>

    <div class="card">

        <img src="lake.jpg" alt="Lago di Braies">

        <div class="content">

            <div class="tags">
                <span>Nature</span>
                <span>Lake</span>
            </div>

            <h2>Lago di Braies</h2>

            <p>
                Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                Consectetur sodales morbi dignissim sed diam pharetra
                vitae ipsum odio.
            </p>

            <button>Read More</button>

        </div>

    </div>

</body>

</html>
